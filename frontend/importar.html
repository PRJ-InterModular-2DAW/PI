<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Importar Productes</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        input[type="file"] { border: 1px solid #ccc; padding: 10px; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>📥 Importador de Productes</h1>
    <a href="http://localhost:8080">Home</a>
    <p>Puja un fitxer Excel (.xlsx, .xls) amb les columnes: <strong>SKU, Nom, Descripció, Imatge, Preu, Estoc</strong>.</p>
    
    <form action="/importar_excel.php" method="post" enctype="multipart/form-data">
        <label for="excelFile">Selecciona el fitxer:</label>
        <input type="file" name="excelFile" id="excelFile" accept=".xlsx, .xls" required>
        <button type="submit">🚀 Importar Productes</button>
    </form>
</body>
</html>
